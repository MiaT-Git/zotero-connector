[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "znlm"
version = "0.1.0"
description = "Zotero → Google Drive connector for NotebookLM"
requires-python = ">=3.11"
dependencies = [
    "pyzotero>=1.5",
    "google-api-python-client",
    "google-auth-oauthlib",
    "typer>=0.12",
    "pydantic>=2",
    "pydantic-settings>=2",
    "rich>=13",
    "httpx>=0.27",
    "aiofiles>=23",
    "loguru>=0.7",
    "requests",
]

[project.scripts]
znlm = "znlm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/znlm"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
